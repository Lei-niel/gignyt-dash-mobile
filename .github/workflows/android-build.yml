name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Project Dependencies
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Initialize Capacitor Configuration
      run: |
        npx cap init "Gignyt Dash" "com.gignyt.dash" --web-dir=www

    - name: Add Android Platform Framework
      run: |
        npx cap add android
        npx cap sync android

    - name: Patch Duplicate Kotlin Resolution Rules
      run: |
        # Injects a global strategy to exclude old legacy duplicate modules
        cat << 'EOF' >> android/build.gradle
        subprojects {
            project.configurations.all {
                resolutionStrategy.eachDependency { details ->
                    if (details.requested.group == 'org.jetbrains.kotlin') {
                        details.useVersion '1.8.22'
                    }
                }
            }
        }
        EOF

    - name: Build the APK File
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Gignyt-Dash-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
